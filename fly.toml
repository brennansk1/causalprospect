# CausalProspect — Fly.io deployment for the FastAPI backend.
# `fly launch` → `fly deploy`.

app = "causalprospect"
primary_region = "sjc"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"   # scale to zero when idle
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
method = "get"
path = "/api/health"
interval = "30s"
timeout = "3s"

[env]
CP_CACHE = "/app/data/cache"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024

[mounts]
source = "cp_data"
destination = "/app/data"
