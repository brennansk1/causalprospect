server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache immutable build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Short cache for JSON data so the latest pipeline output propagates.
  location /data/ {
    expires 5m;
    add_header Cache-Control "public";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
