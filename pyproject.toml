[project]
name = "causalprospect"
version = "0.1.0"
description = "Causal discovery-enhanced critical mineral prospectivity with conformal prediction"
authors = [{ name = "Brennan Kelley" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  # Core data
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15",
  "pandas>=2.2",
  "numpy>=1.26,<2.3",
  "scipy>=1.11",
  # Geospatial
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "xarray>=2024.3",
  "h3>=4.1",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "stackstac>=0.5",
  # ML / causal
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "causal-learn>=0.1.4",
  "networkx>=3.2",
  "tigramite>=5.2",
  "pysal>=24.1",
  "libpysal>=4.9",
  "mapie>=0.9",
  # Deep learning (optional extras in requirements but kept here for reproducibility)
  "torch>=2.3",
  # Viz / io
  "matplotlib>=3.8",
  "plotly>=5.22",
  # Config / API
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "httpx>=0.27",
  "tenacity>=8.2",
  "tqdm>=4.66",
  "structlog>=24.1",
]

[project.optional-dependencies]
gnn = ["torch-geometric>=2.5"]
embeddings = ["transformers>=4.40", "huggingface-hub>=0.23"]
dev = ["pytest>=8.1", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
cp-download = "causalprospect.data.ingest:main"
cp-run = "scripts.run_pipeline:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["causalprospect*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
